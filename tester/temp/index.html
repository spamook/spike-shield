<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fake App stub</title>
</head>
<body data-state="loading">
  <div id="content">Loading idea roaster...</div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var mode = params.get("mode") || "ready"; // ready | error | timeout
      var delay = Number(params.get("delay") || "300");
      var api = params.get("api") || "http://localhost:54321";

      document.body.setAttribute("data-state", "loading");

      fetch(api + "/rest/v1/posts?mode=" + mode + "&delay=" + delay)
        .then(function (r) {
          if (!r.ok) throw new Error("bad status " + r.status);
          return r.json();
        })
        .then(function () {
          document.body.setAttribute("data-state", "ready");
          document.getElementById("content").textContent = "Feed loaded.";
        })
        .catch(function () {
          document.body.setAttribute("data-state", "error");
          document.getElementById("content").textContent = "Something went wrong.";
        });
    })();
  </script>
</body>
</html>
